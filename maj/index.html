<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stresshin Impact 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#120e1c;--fg:#ece8f7;--pill:rgba(20,14,36,.78);--acc:#7c5ce6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120e1c}}
:root[data-theme="dark"]{--bg:#120e1c}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0px) 8px env(safe-area-inset-bottom,0px)}
.pill{background:var(--pill);border:1px solid #4a3d7a;border-radius:12px;padding:6px 12px;font-size:.95rem;display:inline-block}
.e b{color:#ff7a68}.p b{color:#5fe0cf}
#top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-top:8px}
#log{font-size:.75rem;background:var(--pill);border-radius:10px;padding:6px 10px;max-width:50%;min-height:1.5em}
#bot{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:space-between;align-items:flex-end}
button{pointer-events:auto;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;margin-left:6px}
button:disabled{opacity:.45}
#msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;font-size:1.3rem;font-weight:800;background:var(--pill);border:2px solid #e8b84d;border-radius:16px;padding:16px 22px;display:none;max-width:80%}
#note{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);text-align:center;font-size:9px;opacity:.55}
.bar{width:110px;height:10px;background:#0006;border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle;margin:0 6px}
.bar i{display:block;height:100%;width:100%;transition:width .4s}.e .bar i{background:#ff5a48}.p .bar i{background:#4fe0cc}
.cr{display:inline-block;width:14px;height:14px;border-radius:50%;margin:3px 1px 0;border:1px solid #3b82f6}.cr.on{background:#3b82f6;box-shadow:0 0 6px #3b82f6}.cr.used{background:#1d2f55}
.btns{display:flex;gap:4px}.sm{padding:6px 10px;margin:0}
#hint{position:absolute;left:8px;top:52px;max-width:300px;text-align:left;font-size:.85rem;text-shadow:0 1px 4px #000}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:2.2rem;font-weight:900;opacity:0;text-shadow:0 0 20px #7c5ce6}
#banner.go{animation:bn 1.6s}@keyframes bn{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
#toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);max-width:min(560px,92vw);background:var(--pill);border:1px solid #4fe0cc;border-radius:12px;padding:8px 12px;font-size:.85rem;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}#toast.foe{border-color:#ff7a68}
#info{position:absolute;left:8px;top:120px;max-width:230px;background:var(--pill);border:1px solid #4a3d7a;border-radius:12px;padding:8px 10px;font-size:.8rem;display:none}.tp{margin-top:6px;color:#9be7dc}
#end.pulse{animation:pu 1s infinite}@keyframes pu{50%{box-shadow:0 0 0 8px #7c5ce655}}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,7,20,.85);backdrop-filter:blur(4px);z-index:5;padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px)}
.mc{max-width:520px;width:100%;max-height:92vh;overflow:auto;text-align:center;touch-action:pan-y}.mc h1{font-size:2.2rem;margin:0 0 4px}.mc p{opacity:.85}
.mb{display:block;width:100%;margin:10px 0;padding:14px;font-size:1.05rem;border-radius:12px}.mb.alt{background:#3a3350}
.mc ol,.mc ul{text-align:left;font-size:.9rem;line-height:1.5}.tl li{margin-bottom:6px}.w{font-size:.75rem;opacity:.7}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.dc{background:#251d3a;border:1px solid #4a3d7a;border-radius:10px;padding:8px;text-align:left;font-size:.8rem}.dc.on{border-color:#4fe0cc}.dc small{display:block;opacity:.8}
.dq{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:6px}.dq button{padding:4px 12px;margin:0}
#say{position:absolute;left:50%;top:112px;transform:translateX(-50%);background:var(--pill);border:1px solid #e8b84d;border-radius:12px;padding:6px 12px;opacity:0;transition:opacity .3s}#say.show{opacity:1}
#qm{position:absolute;right:8px;top:48px;display:none;flex-direction:column;gap:4px}#qm button{pointer-events:auto;margin:0;padding:6px 10px;font-size:.8rem}
.mc h3{margin:12px 0 4px}.mc li .sm{margin-left:6px}
#hud.cb .e .bar i{background:#D55E00}#hud.cb .p .bar i{background:#56B4E9}
#leg{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:.72rem;text-shadow:0 1px 3px #000}
input[type=range]{accent-color:#7c5ce6;height:28px}
.mc{overflow-x:hidden}
.mc input[type=text],.mc input:not([type]),.mc input[type=search]{box-sizing:border-box}

function bossToast(t){const e=$("toast");e.innerHTML=t;e.className="show foe";clearTimeout(tt);tt=setTimeout(()=>{e.className=""},7000)}
function startBoss(i){const b=BOSS[i];if(!b||(i>0&&!CAMP[i-1]))return;aInit();if(DK.length!==DECK)fillDeck();inGame=true;newGame(b.lvl,"P",false,i);
 if(AU.ctx&&AU.auto)setTrack(pickTrk(),1);menuClose();banner(b.n);lg("Boss : "+b.n);bossToast("⚠ <b>"+b.n+"</b> — "+b.rule)}
function planTog(i){const n=PC[i].n;if(PP.has(n))PP.delete(n);else if(PP.size<3)PP.add(n);menuScreen("planpick")}
function planText(){return "Mon plan anti-stress"+(PLAN.date?" ("+PLAN.date+")":"")+"\n"+PLAN.names.filter(x=>TIPS[x]).map((x,i)=>(i+1)+". "+x+" : "+TIPS[x]).join("\n")}
function planCopy(){const t=planText();let ok=false;try{if(navigator.clipboard){navigator.clipboard.writeText(t);ok=true}}catch(e){}
 if(!ok)try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();ok=true}catch(e){}tipToast(ok?"📋 Plan copié !":"Copie impossible")}
/* ---------- deck ---------- */
const DECK=20,CAT=Object.fromEntries([...PC,...EC].map(c=>[c.n,c]));
function getDeck(){try{const d=JSON.parse(localStorage.stdeck);if(Array.isArray(d)&&d.length<=DECK&&d.every(n=>PC.some(c=>c.n===n)))return d}catch(e){}return PC.slice(0,DECK).map(c=>c.n)}
let DK=getDeck();
const saveDeck=()=>{try{localStorage.stdeck=JSON.stringify(DK)}catch(e){}};
function fillDeck(){while(DK.length<DECK){const c=PC[Math.random()*PC.length|0];if(DK.filter(x=>x===c.n).length<2)DK.push(c.n)}saveDeck()}
const playerDeck=()=>sh(DK.map(n=>({...CAT[n],uid:++uidn,tip:TIPS[n]})));
const hid=n=>Array.from({length:n},()=>({uid:++uidn,hidden:1}));
function dk(i,d){const n=PC[i].n,cnt=DK.filter(x=>x===n).length;if(d>0&&cnt<2&&DK.length<DECK)DK.push(n);if(d<0&&cnt>0)DK.splice(DK.indexOf(n),1);saveDeck();const st=menu.firstChild.scrollTop;menuScreen("deck");menu.firstChild.scrollTop=st}
/* ---------- règles ---------- */
function draw(X,n=1){for(let i=0;i<n;i++){if(!X.deck.length)X.deck=X.hidden?hid(DECK):X.k==="P"?playerDeck():X.k==="E"&&!X.hidden?enemyDeck():mkDeck(X.src);const c=X.deck.pop();if(X.hand.length<10)X.hand.push(c)}}
function lg(t){G.log.unshift(t);G.log.length=2}
function check(){if(G.E.hp<=0)G.over="win";else if(G.P.hp<=0)G.over="lose"}
function cast(X,Y,c){
 if(c.sp==="heal"){const b=X.hp;X.hp=Math.min(X.mhp||MAXHP,X.hp+c.v);G.fx.push({t:X.k,v:X.hp-b,k:"heal"})}
 if(c.sp==="draw")draw(X,c.v);
 if(c.sp==="dmg"){Y.hp-=c.v;G.fx.push({t:Y.k,v:c.v,k:"dmg"})}
 if(c.sp==="kill")for(let i=0;i<(c.v||1)&&Y.board.length;i++){const b=Y.board.reduce((p,m)=>m.a+m.h>p.a+p.h?m:p);G.fx.push({t:b.uid,v:b.h,k:"dmg"});Y.board.splice(Y.board.indexOf(b),1)}
 check()}
const legal=(Y,t)=>{const tn=Y.board.filter(m=>m.t);return !tn.length||(t!=="hero"&&Y.board[t]&&Y.board[t].t)};
function attack(X,Y,m,t){m.can=false;
 if(t==="hero"){Y.hp-=m.a;G.fx.push({t:Y.k,v:m.a,k:"dmg"})}
